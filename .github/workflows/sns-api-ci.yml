name: SNS API Skill CI

on:
  pull_request:
    paths:
      - ".github/workflows/sns-api-ci.yml"
      - ".gitignore"
      - "README.md"
      - "skills/SKILLS.md"
      - "skills/sns-api/**"
      - "evals/sns-api/**"
      - "tests/test_sns_api_*.py"
      - "tests/sns_api_helpers.py"
      - "tools/score-behavior-eval.py"
      - "tools/validate-skills.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sns-api-ci.yml"
      - ".gitignore"
      - "README.md"
      - "skills/SKILLS.md"
      - "skills/sns-api/**"
      - "evals/sns-api/**"
      - "tests/test_sns_api_*.py"
      - "tests/sns_api_helpers.py"
      - "tools/score-behavior-eval.py"
      - "tools/validate-skills.sh"

permissions:
  contents: read

jobs:
  validate-sns-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate Skill contracts
        run: bash tools/validate-skills.sh
      - name: Compile deterministic stdlib runtime
        run: python3 -m compileall -q skills/sns-api/scripts tests
      - name: Run all repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate SNS behavior eval cases
        run: python3 tools/score-behavior-eval.py --cases evals/sns-api/cases.json
      - name: Scan public repository privacy and secrets
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/public_repo_scan.py --commit-range "${SCAN_BASE}..${SCAN_HEAD}"
