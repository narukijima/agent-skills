name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate repository contracts
        run: bash tools/validate-skills.sh
      - name: Scan public repository privacy and secrets
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/public_repo_scan.py --commit-range "${SCAN_BASE}..${SCAN_HEAD}"
      - name: Validate every published skill against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*/; do
            [[ "$(basename "$skill")" == "_template" ]] && continue
            skills-ref validate "$skill"
          done
      - name: Run tests
        run: python -m unittest discover -s tests -v
