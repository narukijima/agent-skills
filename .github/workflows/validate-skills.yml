name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate repository contracts
        run: bash tools/validate-skills.sh
      - name: Validate every published skill against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*/; do
            [[ "$(basename "$skill")" == "_template" ]] && continue
            skills-ref validate "$skill"
          done
      - name: Run tests
        run: python -m unittest discover -s tests -v
